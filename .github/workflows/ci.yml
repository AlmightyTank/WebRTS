name: Meridian Warfront — Godot 4 Skirmish + Combat

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  combat-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Validate balance registry
        run: python3 godot/tests/data_contract.py
      - name: Import and parse Godot scripts
        run: godot --headless --editor --path godot --import --quit
      - name: Execute combat behavior assertions
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot --script res://tests/combat_smoke.gd 2>&1 | tee combat-smoke.log
          grep -q COMBAT_SMOKE_PASS combat-smoke.log
      - name: Test combat pursuit, minimum range and projectile layers
        run: timeout 45s godot --headless --path godot --script res://tests/combat_reliability_smoke.gd
      - name: Test bounded combat feedback and fog safety
        run: timeout 45s godot --headless --path godot --script res://tests/combat_feedback_smoke.gd
      - name: Test shroud, exploration and visibility rules
        run: timeout 45s godot --headless --path godot --script res://tests/fog_of_war_smoke.gd
      - name: Test construction, ore, power and production
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot --script res://tests/skirmish_smoke.gd 2>&1 | tee skirmish-smoke.log
          grep -q SKIRMISH_SMOKE_PASS skirmish-smoke.log
      - name: Test RA2 refunds, repairs, sale, expansion and capture
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot --script res://tests/ra2_systems_smoke.gd 2>&1 | tee ra2-smoke.log
          grep -q RA2_SYSTEMS_SMOKE_PASS ra2-smoke.log
      - name: Test shared rally staging areas and attack-move orders
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot --script res://tests/rally_staging_smoke.gd 2>&1 | tee rally-smoke.log
          grep -q RALLY_STAGING_SMOKE_PASS rally-smoke.log
      - name: Test responsive production HUD and active producer controls
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot --script res://tests/production_hud_smoke.gd 2>&1 | tee production-hud.log
          grep -q PRODUCTION_HUD_SMOKE_PASS production-hud.log
      - name: Test RA2-style sidebar radar, icon tiles and tactical bar
        shell: bash
        run: |
          set -o pipefail
          timeout 45s godot --headless --path godot --script res://tests/retro_command_hud_smoke.gd 2>&1 | tee retro-ui-smoke.log
          grep -q RETRO_COMMAND_HUD_SMOKE_PASS retro-ui-smoke.log
      - name: Test automatic scouting and cancellation
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/scouting_smoke.gd
      - name: Test ground movement and order regressions
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/movement_orders_smoke.gd
      - name: Test viewport movement input and queued commands
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/movement_input_smoke.gd
      - name: Test shared artwork meshes for every unit
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/unit_mesh_cache_smoke.gd
      - name: Test playable armies and general rules
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/army_rules_smoke.gd
      - name: Test commander research, progression and support powers
        run: godot --headless --path godot --script res://tests/commander_kits_smoke.gd
        timeout-minutes: 2
      - name: Test match audio cues
        run: godot --headless --path godot --script res://tests/match_audio_smoke.gd
        timeout-minutes: 2
      - name: Test skirmish save and resume
        run: godot --headless --path godot --script res://tests/match_save_smoke.gd
        timeout-minutes: 2
      - name: Test captured relay income
        run: godot --headless --path godot --script res://tests/relay_income_smoke.gd
        timeout-minutes: 2
      - name: Test airfield production and rearm
        run: godot --headless --path godot --script res://tests/airfield_smoke.gd
        timeout-minutes: 2
      - name: Test faction superweapons
        run: godot --headless --path godot --script res://tests/superweapon_smoke.gd
        timeout-minutes: 2
      - name: Test walls and gates
        run: godot --headless --path godot --script res://tests/walls_smoke.gd
        timeout-minutes: 2
      - name: Test skirmish maps
        run: godot --headless --path godot --script res://tests/maps_smoke.gd
        timeout-minutes: 2
      - name: Test Rook, Volkov, and Nadir
        run: godot --headless --path godot --script res://tests/generals_smoke.gd
        timeout-minutes: 2
      - name: Launch skirmish startup regression
        run: godot --headless --path godot --quit-after 180
