name: Meridian Warfront — Godot 4

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2.4.3
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import resources and check scripts
        run: godot --headless --path godot --editor --quit
      - name: Map serialization round trip
        run: godot --headless --path godot --script res://scripts/checks/map_roundtrip.gd
      - name: Launch battlefield smoke test
        run: godot --headless --path godot --quit-after 10
