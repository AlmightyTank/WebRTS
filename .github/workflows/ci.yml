name: WebRTS checks

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser automation
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile placement playtests
        run: node --test tests/browser-placement.test.mjs
      - name: Upload playtest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
